spring.application.name=backend

# Settings that differ between your laptop and production are written as
# ${ENVIRONMENT_VARIABLE:default}. Locally no variable is set, so the default
# after the colon is used. In production the host sets the variable and it wins.
# A value with no default (the password) must always be provided.

# Hosts such as Render and Railway tell the app which port to listen on via PORT.
server.port=${PORT:8080}

spring.datasource.url=${WORDLE_DB_URL:jdbc:postgresql://localhost:5432/wordle}
spring.datasource.username=${WORDLE_DB_USERNAME:wordle_app}
spring.datasource.password=${WORDLE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Browser origins allowed to call the API, comma-separated.
wordle.cors.allowed-origins=${WORDLE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Only the health check is exposed over HTTP: GET /actuator/health returns
# {"status":"UP"} when the app and its database connection are working.
management.endpoints.web.exposure.include=health
